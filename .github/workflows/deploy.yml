name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs at 17:00 UTC every day
    - cron: "0 17 * * *"

jobs:
  build:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for GitHub Pages OIDC
      contents: write # Needed to push commits
      pages: write # Needed to deploy to GitHub Pages

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck & test
        run: |
          bun check
          bun test

      - name: Update wallpapers & README
        if: github.event_name == 'push'
        run: |
          bun run wallpapers
          bun run markdown

      - name: Build
        run: bun run build

      # Only commit generated data and README to avoid accidentally committing other files
      - name: Commit generated files
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "695601626@qq.com"
          git config --local user.name "linbingquan"
          git add data/wallpapers.json README.md
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "docs: update wallpapers [skip ci]"
            git push
          fi

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v5
