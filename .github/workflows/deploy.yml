name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs at 17:00 UTC every day
    - cron: "0 17 * * *"

jobs:
  build:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for GitHub Pages OIDC
      contents: write # Needed to push commits
      pages: write # Needed to deploy to GitHub Pages

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - run: |
          node --version
          npm --version
          npm install
      - run: |
          npm run wallpapers
      - run: |
          npm run markdown

      - name: Commit files
        run: |
          git config --local user.email "695601626@qq.com"
          git config --local user.name "linbingquan"
          git add .
          git commit -m "feat(deploy): workflow action for deploy" || echo "no changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./packages/hono/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
