name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs at 17:00 UTC every day
    - cron: "0 17 * * *"

jobs:
  build:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for GitHub Pages OIDC
      contents: write # Needed to push commits
      pages: write # Needed to deploy to GitHub Pages

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck & test
        run: |
          npm run typecheck
          npm test

      - name: Update wallpapers & README
        if: github.event_name == 'push'
        run: |
          npm run wallpapers
          npm run markdown

      - name: Build
        run: npm run build

      # 只提交生成的数据与 README，避免误提交其它文件
      - name: Commit generated files
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "695601626@qq.com"
          git config --local user.name "linbingquan"
          git add packages/wallpapers/wallpapers.json README.md
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "docs: update wallpapers [skip ci]"
            git push
          fi

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./packages/hono/dist"

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v5
